sion-report-mediterranean-sea-na.jpg","bytes":20095,"sha256":"03b730443d7be1c67478fc26da8ed664cb48b97acdb817caca3b04fd9b9b82a8","extracted_text_path":"extracted/dow-038-dow-uap-d54-mission-report-mediterranean-sea-na.md","year":null,"ents":{"military_units":["AARO"],"classification":["SECRET//NOFORN","SECRET","NOFORN"],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Unidentified Anomalous Phenomena","President Trump","Event Description"],"mgrs":[]}},{"id":"dow-039-dow-uap-d55-mission-report-syria-november-2016","type":"pdf","title":"DOW-UAP-D055, Mission Report, Syria, November 2016","agency":"DoW","agency_raw":"Department of War","release_date":"5/8/26","incident_date":"11/18/16","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Syria","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This document is a mission briefing summarizing an observation of Unidentified Anomalous Phenomena (UAP) by a U.S. military platform near Latakia, Syria.\nA U.S. military pilot flying a P-8A aircraft reported observing an object via the aircraft’s EO/IR sensor, which they characterized as appearing to be in “sea skim mode,” traveling at approximately 500 knots (575 mph) on a southeasterly heading. The P-8A lost visual contact with the object after two minutes.\nAll descriptive and estimative language contained in this report reflects the reporter’s subjective interpretation at the time of the event. Such characterizations should not be interpreted as a conclusive indication of the presence or absence of any intrinsic object features or performance characteristics.","redaction":"TRUE","source_url":"https://www.war.gov/medialink/ufo/release_1/dow-uap-d55-mission-report-syria-november-2016.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/dow-uap-d55-mission-report-syria-novembe ight of the sensor field-of-view. At approximately six seconds, the area of contrast leaves the sensor field-of-view near the top right corner of the frame.\n\nThis video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"","modal_image_url":"","bytes":3577372,"sha256":"3d342c414f2f17a80bdfb4829d54945eddbd96c1184bff26ffd8449426c6daef","extracted_text_path":"extracted/dow-058-dow-uap-pr23-unresolved-uap-report-iraq-december-2022.md","year":null,"ents":{"military_units":["AARO"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Video Description","President Trump"],"mgrs":[]}},{"id":"dow-059-dow-uap-pr26-unresolved-uap-report-united-arab-emirates-octo","type":"video","title":"DOW-UAP-PR026, Unresolved UAP Report, United Arab Emirates, October 2023","agency":"DoW","agency_raw":"Department of War","release_date":"5/8/26","incident_date":"N/A","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"United Arab Emirates","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"The United States Central Command submitted a report of an unidentified anomalous phenomenon to the All-domain Anomaly Resolution Office (AARO) consisting of 43 seconds of video footage from an infrared sensor aboard a U.S. military platform in 2023. An accompanying mission report, DoW-UAP-D23, mentions a UAP was observed during the mission.\n\nVideo Description:\n00:00-00:17: An area of contrast remains generally within the top left quarter of the display.\n00:17-00:18: The sensor pans from right to left, causing the area of contrast to pass through the center of the display. The sensor then pans from left to right, causing the area of contrast to return to its approximate initial position within the sensor field-of-view.\n00:29: The sensor stops tracking the area of contrast, causing it to leave the sensor field-of-view on the left side of the screen.\n00:30-00:43: The sensor resumes its motion relative to the background but does not reacquire the area of contrast.\n\nThis video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"","modal_image_url":"","bytes":17103229,"sha256":"661418d9b048cc604be5f8fabd861fccb1a2fad08c7b7c1c32815f6300085f90","extracted_text_path":"extracted/dow-059-dow-uap-pr26-unresolved-uap-report-united-arab-emirates-octo.md","year":null,"ents":{"military_units":["AARO"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Video Description","President Trump","Image Description"],"mgrs":[]}},{"id":"dow-060-dow-uap-pr27-unresolved-uap-report-united-arab-emirates-octo","type":"video","title":"DOW-UAP-PR027, Unresolved UAP Report, United Arab Emirates, October 2023","agency":"DoW","agency_raw":"Department of War","release_date":"5/8/26","incident_date":"N/A","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"United Arab Emirates","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"The United States Central Command submitted a report of an unidentified anomalous phenomenon to the All-domain Anomaly Resolution Office (AARO) consisting of four minutes and 57 seconds of video footage from an infrared (IR) sensor aboard a U.S. military platform in 2023. An accompanying mission report, DoW-UAP-D23, mentions a UAP was observed during the mission.\n\nVideo Description:\n00:00-01:55: No content.\n01:56: An area of contrast becomes distinguishable against the background in the center of the right side of the display.\n02:04: The IR sensor pans to center on the area of contrast.\n02:14: The sensor field-of-view narrows to zoom in on the area of contrast.\n02:15-03:26: The area of contrast remains generally in the center of the sensor field-of-view. \n03:27-04:57: The sensor motion causes the area of contrast to move erratically across the display. Due to this motion, the sensor system repeatedly loses and reacquires the area of contrast within the center area of the display.\n\nThis video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"","modal_image_url":"","bytes":97932504,"sha256":"975d9afa52fcf5da022ebe695c2976ebf6a7eae38c07f62a6be09e7ce5af28e5","extracted_text_path":"extracted/dow-060-dow-uap-pr27-unresolved-uap-report-united-arab-emirates-octo.md","year":null,"ents":{"military_units":["AARO"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Video Description","President Trump"],"mgrs":[]}},{"id":"dow-061-dow-uap-pr28-unresolved-uap-report-greece-january-2024","type":"video","title":"DOW-UAP-PR028, Unresolved UAP Report, Greece, January 2024","agency":"DoW","agency_raw":"Department of War","release_date":"5/8/26","incident_date":"N/A","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Greece","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"The United States Central Command submitted a report of an unidentified anomalous phenomenon (UAP) to the All-domain Anomaly Resolution Office (AARO) consisting of one minute and five seconds of video footage captured via multiple sensor modalities aboard a U.S. military platform in 2024. An accompanying mission report, DoW-UAP-D7, described the UAP as “diamond-shaped” and moving at approximately 434 knots. The observer also reported that the UAP was only detectable via short-wave infrared (SWIR) sensor.\n\nVideo Description: The screen is split into two viewing areas for the first ten seconds of the video, with the right side displaying electro-optical footage and the left side displaying SWIR footage.\n00:04: An area of contrast becomes distinguishable against the background in the center of the right frame.\n00:10: The display shifts to a full-screen view of the SWIR feed to better focus on the area of contrast.\n00:55: The area of contrast remains generally within the center of the sensor field-of-view. The area of contrast visually resembles an inverted teardrop with a vertically linear trailing mass suspended below.\n00:56: The operator switches the sensor modality to visible spectrum, losing the subject against the background.\n00:57-01:05: The operator switches the sensor modality to SWIR (Black-Hot) but does not reacquire the area of contrast.\n\nThis video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"","modal_image_url":"","bytes":10574866,"sha256":"efb1ff764152f5066e9a41fe2dcbc2f689c63758ed479774e5f5340f66b9b144","extracted_text_path":"extracted/dow-061-dow-uap-pr28-unresolved-uap-report-greece-january-2024.md","year":null,"ents":{"military_units":["AARO"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[ ],"case_numbers":[],"names":["Video Description","President Trump"],"mgrs":[]}},{"id":"dow-063-dow-uap-pr31-unresolved-uap-report-syria-october-2024","type":"video","title":"DOW-UAP-PR031, Unresolved UAP Report, Syria, October 2024","agency":"DoW","agency_raw":"Department of War","release_date":"5/8/26","incident_date":"N/A","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Syria","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"The United States Central Command submitted a report of an unidentified anomalous phenomenon (UAP) to the All-domain Anomaly Resolution Office (AARO) consisting of five seconds of video footage from a full-motion video (FMV) camera aboard a U.S. military platform in 2024. An accompanying mission report, DoW-UAP-D32, described the UAP as consisting of a “misshapen and uneven ball of white light,” and reported that a “light/glare halo effect” occurred at the top of the FMV feed.\n\nVideo Description:\n00:00-00:01: An indistinctly shaped multi-colored area moves from right to left across the top edge of the sensor display within the first second of the video.\n\nThis video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"","modal_image_url":"","bytes":516685,"sha256":"1668686a39e0f8b0bafab98aa588dc37ff0c435834053c41fb40416cca734e48","extracted_text_path":"extracted/dow-063-dow-uap-pr31-unresolved-uap-report-syria-october-2024.md","year":null,"ents":{"military_units":["AARO"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Video Description","President Trump"],"mgrs":[]}},{"id":"dow-064-dow-u etermination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"https://www.war.gov/medialink/ufo/release_1/fbi-photo-b8.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/fbi-photo-b8.jpg","bytes":585686,"sha256":"cae6a62245153fd16acd8c4ff995d19c49fdadf7be152a85c8fe5d714fc3f423","extracted_text_path":"extracted/fbi-051-fbi-photo-b8.md","year":2025,"ents":{"military_units":["AARO","FBI"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Narrative Description","President Trump"],"mgrs":[]}},{"id":"fbi-052-fbi-photo-b9","type":"pdf","title":"FBI Photo B009","agency":"FBI","agency_raw":"FBI","release_date":"5/8/26","incident_date":"Late 2025","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Western United States","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"The Federal Bureau of Investigation (FBI) submitted a report of an unidentified anomalous phenomenon (UAP) to the All-domain Anomaly Resolution Office (AARO) consisting of a still image derived from a U.S. military system in 2025. The original imagery was altered with redactions before being submitted to AARO. An accompanying mission report was not provided. The operator reported that they were unable to positively identify the UAP. The date in the image is incorrect due to system date/time not being set.\n\nNarrative Description: The monochrome image displays a grainy texture with a central crosshair reticle. A small, dark, circular object is visible just below and to the left of the center of the reticle. The background appears to show an indistinct mountain range. This narrative description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"https://www.war.gov/medialink/ufo/release_1/fbi-photo-b9.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/fbi-photo-b9.jpg","bytes":588086,"sha256":"e61a49212bb82cfc9a6e7627a2291c9159bbbb2272fb995e45411a48e44eb0b1","extracted_text_path":"extracted/fbi-052-fbi-photo-b9.md","year":2025,"ents":{"military_units":["AARO","FBI"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Narrative Description","President Trump"],"mgrs":[]}},{"id":"fbi-053-usper-statement-about-uap-sighting","type":"pdf","title":"USPER Statement about UAP Sighting","agency":"FBI","agency_raw":"FBI","release_date":"5/8/26","incident_date":"Late 2025","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"United States","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This is an FBI 302 interview conducted with a senior US intelligence official regarding his first-hand account of a UAP encounter at a US military facility. USPER relayed to FBI agents that he and other federal and state personnel conducted searches to where orbs had been previously seen. After searching the area with a helicopter, they found a “super-hot” orb hovering over the ground. The orb is reported to have travelled for 20 miles at a speed too fast for the helicopter in pursuit. An additional “swarm” of lights were seen moving in all directions. A total of four or five additional orbs were seen shortly thereafter for a short time, flaring up and then down. This pattern of four or five orbs flaring up, then down continued over the next thirty minutes across the area.\n\nThe photos linked in the \"Related Media\" section are connected to a set of UAP encounters on a sensitive government testing installation in the Western US in 2025. These orb-like UAP were observed at various ranges by multiple, and in some cases simultaneous, government personnel and sensors. The linked narrative is an FBI-collected account from a senior U.S. intelligence community official who witnessed the UAP with the naked eye, while accompanied by two pilots under NVGs. Other pilots in separate aircraft, and ground-based observers with night vision, also witnessed UAP during the exercise. The photos of UAP underneath the helicopter are from this same set of observations, taken through night vision devices by ground-based personnel.","redaction":"TRUE","source_url":"https://www.war.gov/medialink/ufo/release_1/usper-statement-redacted.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/usper-statement-redacted.jpg","bytes":786792,"sha256":"63deae172b2bd4923696ed097c0c25d1286f116be1efb313d14c0630ac0a1786","extracted_text_path":"extracted/fbi-053-usper-statement-about-uap-sighting.md","year":2025,"ents":{"military_units":["FBI","RAF"],"classification":["SECRET//NOFORN","SECRET","NOFORN"],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["President Trump","Listening Post","Observation Post","Forward Looking Infrared","Night Vision\nGoggles"],"mgrs":[]}},{"id":"fbi-054-fbi-september-2023-sighting-composite-sketch","type":"pdf","title":"FBI September 2023 Sighting - Composite Sketch","agency":"FBI","agency_raw":"FBI","release_date":"5/8/26","incident_date":"9/1/23","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"United States","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"Actual site photo with FBI Lab rendered graphic overlay depicting corroborating eyewitness reports from September 2023 of an apparent ellipsoid bronze metallic object materializi ,"Texas","Utah","Virginia","Washington","Wyoming"],"aircraft":["F-4","F-16"],"operations":[],"case_numbers":[],"names":["Higher Studies","National Defence","Carol Rosin","President Trump","Manzanita Ct","Hi Dan\nJon","Hillstreet Blues","Major Dan","The Impossible\nDream","La Mancha","Outer Space","Space Foundation","Daw As","Wor Eoveemenr","Guaury Aue","Aareies Ate","Srey\nHe","On Piphe","Er Tenn","For Reservations Call","Prwites Ss","Meple Hes Tasik","Ed Arde Lett","Cart Toe","Soon Te"],"mgrs":[]}},{"id":"nasa-002-nasa-uap-d3-gemini-7-transcript-1965","type":"pdf","title":"NASA-UAP-D003, Gemini 7 Transcript, 1965","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"12/5/65","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Low Earth Orbit","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"Gemini 7 was the tenth crewed American spaceflight. This document is a transcript of communications between the flight crew, Astronauts James “Jim” Lovell and Frank Borman, and the Manned Flight Center (now known as Johnson Space Center) in Houston, Texas. The transcript begins with Borman’s report of a “bogey,” contemporary nomenclature for an unknown aircraft, as well as a debris field. Borman described the debris field as consisting of “very, very many […] hundreds of little particles.” He estimated the particles’ distance from the spacecraft to be four miles. Lovell described observing a “brilliant body in the sun against a black background with trillions of particles on it.”\nThis document also includes handwritten notes documenting the encounter, annotated with the phrase “UFO Sighting by Borman” in the top right corner.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/255_t_763_r1b_transcripts.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/255_t_763_r1b_transcripts.jpg","bytes":328211,"sha256":"73cb8f0dc879a38811d9d745c11771263e112ec12a0e6bbabc27b9f781ddb74b","extracted_text_path":"extracted/nasa-002-nasa-uap-d3-gemini-7-transcript-1965.md","year":1965,"ents":{"military_units":[],"classification":[],"us_states":["Texas"],"aircraft":[],"operations":[],"case_numbers":[],"names":["Astronauts James","Frank Borman","Manned Flight Center","Johnson Space Center","Low Earth Orbit","Ure Goan"],"mgrs":[]}},{"id":"nasa-003-nasa-uap-d3a-gemini-7-audio-excerpt-1965","type":"audio","title":"NASA-UAP-D003A, Gemini 7 Audio Excerpt, 1965","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"12/5/65","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Low Earth Orbit","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This audio recording contains air to ground communications and the NASA Public Affairs audio feed with commentary, recorded during the flight of the Gemini 7 mission. In this excerpted segment of audio, Astronaut Frank Borman reports to NASA mission control in Houston his sighting of an unidentified object, which he referred to as a \"bogey.\" This sighting occurred on December 5, 1965. The dialogue includes Borman's initial report, as well as additional comments by Astronaut Jim Lovell, Borman's fellow crew member.","redaction":"","source_url":"","modal_image_url":"","bytes":17985081,"sha256":"f0e27641c21c23c93854d58ccf3769e599482892c219b418d0515467270bed93","extracted_text_path":"extracted/nasa-003-nasa-uap-d3a-gemini-7-audio-excerpt-1965.md","year":1965,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Audio Excerpt","Low Earth Orbit","Public Affairs","Astronaut Frank Borman","Astronaut Jim Lovell","Low Earth","Uh This","In Roger","Hi Roger","Frank Borman","Jim Lowell","Germany Control Houston"],"mgrs":[]}},{"id":"nasa-004-nasa-uap-d1-apollo-12-transcript-1969","type":"pdf","title":"NASA-UAP-D001, Apollo 12 Transcript, 1969","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1969","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Moon","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"Apollo 12 was the fourth crewed U.S. mission to the Moon and the second to land astronauts on the lunar surface. This document is an excerpt from the Apollo 12 Technical Air-to-Ground Voice Transcription, November 1969, highlighting two periods in which astronauts reported observing unidentified phenomenon: a one hour period on the fifth day, and a two minute period on the sixth day. These transcripts contain contemporaneous observations by the flight crew reacting to unidentified phenomenon.\n•\tDay 05, Hour 19, Minute 14, Second 58 through Day 05, Hour 20, Minute 12, Second 14:\no\tAt 05:19:27:25, the pilot of the Lunar Module (LMP-LM), Astronaut Alan L. Bean, described observing particles and flashes of light “sailing off in space” via the onboard Alignment Optical Telescope (AOT). He characterized these phenomenon as “escaping the Moon.”\n•\tDay 06, Hour 00, Minute 21, Second 42 through Day 06, Hour 00, Minute 23, Second 33:\no\tMission Commander, Charles “Pete” Conrad, described observing floating debris outside the lunar module, which had been illuminated by the module’s onboard tracking light. At 06:00:21:51, Conrad assessed that the tracking light had burnt out because he could no longer see the debris from the module.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-d1-apollo-12-transcript-1969.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-d1-apollo-12-transcript-1969.jpg","bytes":1030644,"sha256":"ab911622b7d4203d9d54914f03d1662cf561b7f943afe9d17f9617cfaea06585","extracted_text_path":"extracted/nasa-004-nasa-uap-d1-apollo-12-transcript-1969.md","year":1969,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Ground Voice Transcription","Lunar Module","Astronaut Alan","Alignment Optical Telescope","Yankee Clipper","And Jerry"],"mgrs":[]}},{"id":"nasa-005-nasa-uap-d2-apollo-17-transcript-1972","type":"pdf","title":"NASA-UAP-D002, Apollo 17 Transcript, 1972","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1972","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Moon","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"Apollo 17 was the ninth crewed U.S. mission to the Moon, and the sixth to land astronauts on the lunar surface. This document is an excerpt from the Apollo 17 Technical Air-to-Ground Voice Transcription, December 1972, highlighting three periods in which astronauts reported observing unidentified phenomenon: a nine minute period on the first day, a three hour period on the second day, and a six minute period on the third day. \n•\tDay 00, Hour 03, Minute 34, Second 10 through Day 00, Hour 03, Minute 42, Second 29:\n    o\tCommand Module Pilot (CMP), Ronald Evans, reported observing “very bright particles or fragments” drifting and “tumbling” near the spacecraft as it maneuvered. Lunar Module Pilot (LMP), Harrison “Jack” Schmitt, described the phenomenon as looking “like the Fourth of July.” The astronauts speculated that the phenomenon may be attributable to ice or paint fragments dislodging from a separated component of the spacecraft (S-IVB) but characterized that assessment as a “wild guess.”\n•\tDay 02, Hour 18, Minute 42, Second 34 through Day 02, Hour 21, Minute 07, Second 05:\n    o\tMission Commander, Eugene A. Cernan, reported difficulty sleeping and described having observed “some sets of the streaks.” He also described an intense light flashing between his eyes, describing its intensity as comparable to that of a train headlight and characterizing it as “imposing.” Over the next three hours, Cernan described observing several flashing, rotating phenomenon that he assessed as corresponding to physical objects in space rather than a purely optical phenomenon. LMP Schmitt also reported observing similar phenomenon, though he again assessed the source of his observation to be a separated rocket stage (S-IVB). At 02:20:55:22, Cernan reported observing two additional distant flashing objects, though he assessed them as Spacecraft/Lunar Module Adapter panels (SLA panel), another separated component of the Saturn V rocket.\n•\tDay 03, Hour 15, Minute 33, Second 25 through Day 03, Hour 15, Minute 39, Second 46:\n    o\tAt 03:15:38:09, LMP Schmitt exclaimed that he had observed a flash on the lunar surface north of Grimaldi (crater).","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-d2-apollo-17-transcript-1972.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-d2-apollo-17-transcript-1972.jpg","bytes":463669,"sha256":"9d041c8799a0124dc440c05cacd790a43d9e063e399aaa5cd3ee777b14146d03","extracted_text_path":"extracted/nasa-005-nasa-uap-d2-apollo-17-transcript-1972.md","year":1972,"ents":{"military_units":[],"classification":[],"us_states":["Hawaii"],"aircraft":[],"operations":[],"case_numbers":[],"names":["Ground Voice Transcription","Ronald Evans","Lunar Module Pilot","Eugene A. Cernan","Lunar Module Adapter","The Cowboys","Flight Plan","Solomon Islands","New Zealand","Baby Ben","El Lago","Hawaiian Islands","The Solomon Islands","Oceanus Procellarum","Rima Gamma","Mare Marginis","Mare Crisium"],"mgrs":[]}},{"id":"nasa-006-nasa-uap-d4-apollo-11-technical-crew-debriefing-1969","type":"pdf","title":"NASA-UAP-D004, Apollo 11 Technical Crew Debriefing, 1969","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1969","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"N/A","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"Apollo 11 was the third crewed mission to the Moon and the first to land Astronauts on the lunar surface. This document is an excerpt from the Apollo 11 Technical Crew Debriefing (Volumes 1 and 2) from July 31, 1969. The document highlights three observations: one, an object on the way out to the Moon; two, flashes of light inside the cabin; and three, a sighting on the return trip of a bright light tentatively assumed by the crew to be a laser.\n\n•\tPage 6-33 (Vol. 1). [Lunar Module Pilot for Apollo 11, Buzz Aldrin]: “The first unusual thing that we saw I guess was 1 day out or something pretty close to the moon. It had a sizeable dimension to it, so we put the monocular on it.” The crew speculated that it could have been the S-IVB stage of the Saturn V launch vehicle.\n•\tPage 6-37 (Vol. 1). [Lunar Module Pilot for Apollo 11, Buzz Aldrin] “The other observation that I made accumulated gradually. I don’t know whether I saw it the first night, but I’m sure I saw it the second night. I was trying to go to sleep with all the lights out. I observed what I thought were little flashes inside the cabin, spaced a couple of minutes apart…”\n•\tPage 21-1 (Vol. 2). [Lunar Module Pilot for Apollo 11, Buzz Aldrin] “I observed what appeared to be a fairly bright light source which we tentatively ascribed to a possible laser.”","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-d4-apollo-11-technical-crew-debriefing-1969.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-d4-apollo-11-technical-crew-debriefing-1969.jpg","bytes":29286242,"sha256":"aacc41814dd16583bbeabe068026bf286cd9b0e464ff097c5c7b97b00d308443","extracted_text_path":"extracted/nasa-006-nasa-uap-d4-apollo-11-technical-crew-debriefing-1969.md","year":1969,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Technical Crew Debriefing","Lunar Module Pilot","Buzz Aldrin","Policy Directive","Visual Sightings","The Earth"],"mgrs":[]}},{"id":"nasa-007-nasa-uap-d5-apollo-17-crew-debriefing-for-science-1973","type":"pdf","title":"NASA-UAP-D005, Apollo 17 Crew Debriefing for Science, 1973","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1973","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"N/A","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"Apollo 17 was the ninth crewed U.S. mission to the Moon, and the sixth to land Astronauts on the lunar surface. This document is an excerpt from the Apollo 17 Crew Debriefing for Science on January 8, 1973, in which Dick Henry, co-investigator on the ultraviolet experiment on Apollo 17, discusses seeing results that were unexpected. \n•\tPages 119-120. “One of the most exciting results of X-ray astronomy was the fact that an X-ray background was observed over the sky that nobody had expected, and part of this is the gamma-ray background that Dr. Trombka talked about. In the UV, nobody knows, but you never know until you look. You do have to deal with this background of stars that we know is there. So, we did look at a large number of different points at high galactic latitudes, both north and south. The spectrum that we see is above this dark count. In other words, this abnormally high dark current did not, in fact, interfere with that experiment. The spectrum that we see looks like the spectrum of the hot star; however, we know that there were no hot stars within our field of view. Therefore, the most conservative interpretation, I think, is that what we're seeing is light from hot stars in the galactic plane going up out of the plane and reflecting off interstellar dust. There are certain characteristics of the spectrum, though, that don't fit that theory, and it's at least possible that this is extragalactic radiation. I'm looking forward very much to the detailed computer study of this, but it's going to take a long time.”","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-d5-apollo-17-crew-debriefing-for-science-1973.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-d5-apollo-17-crew-debriefing-for-science-1973.jpg","bytes":212585,"sha256":"5d7db3870de8c01a1c39b7e8a4185dd026fe132f01d1cd5ded60f10866722f7e","extracted_text_path":"extracted/nasa-007-nasa-uap-d5-apollo-17-crew-debriefing-for-science-1973.md","year":1973,"ents":{"military_units":["RAF"],"classification":[],"us_states":["Colorado"],"aircraft":[],"operations":[],"case_numbers":[],"names":["Crew Debriefing","Dick Henry","Milky Way","Gary Thomas","Charles Barthum"],"mgrs":[]}},{"id":"nasa-008-nasa-uap-d6-apollo-17-technical-crew-debriefing-1973","type":"pdf","title":"NASA-UAP-D006, Apollo 17 Technical Crew Debriefing, 1973","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1973","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"N/A","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"Apollo 17 was the ninth crewed U.S. mission to the Moon, and the sixth to land Astronauts on the lunar surface. This document is an excerpt from the Apollo 17 Technical Crew Debriefing on January 4, 1973, in which astronaut Harrison Schmitt reported seeing light flashes.\n•\tPage 24-4. [Lunar Module Pilot Harrison Schmitt]: “We had light flashes just about continuously during the whole flight when we were dark adapted. I had one which I thought was a flash on the lunar surface. That one period of time when we had the blindfolds on for the ALFMED [Apollo Light Flash Moving Emulsion Detector] experiment there were just no visible flashes, although that evening, that night, before I went to sleep, I noticed that I was seeing the light flashes again.”","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-d6-apollo-17-technical-crew-debriefing-1973.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-d6-apollo-17-technical-crew-debriefing-1973.jpg","bytes":513402,"sha256":"2c874c40c55505f2348177ddde77c9fd015bf971e6e059c43508a92bc9ee6b30","extracted_text_path":"extracted/nasa-008-nasa-uap-d6-apollo-17-technical-crew-debriefing-1973.md","year":1973,"ents":{"military_units":["RAF"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Technical Crew Debriefing","Harrison Schmitt","Lunar Module Pilot","Apollo Light Flash","Moving Emulsion Detector","Policy Directive"],"mgrs":[]}},{"id":"nasa-009-nasa-uap-d7-skylab-techincal-crew-debriefing-1973","type":"pdf","title":"NASA-UAP-D007, Skylab Techincal Crew Debriefing 1973","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1973","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"N/A","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"Launched on May 14, 1973, Skylab was the United States’ first laboratory in space. From 1973 to 1974, the station was visited by three crews. This document contains excerpts from all three crews to visit the station. In the first excerpt taken from Skylab 1/2 [first crew] Technical Debriefing from June 30, 1973, highlights crew observations of light flashes. The second excerpt taken from Skylab 1/3 Technical Crew Debriefing from October 4, 1973, highlights two observations—a satellite in similar orbit and another object with a “reddish hue to it.” The final excerpt taken from the Skylab 1/4 Technical Crew Debriefing from February 22, 1974, highlights an observation of flashing lights outside Skylab.\n•\tSkylab 2 crew observation: \no\tPage 23-20. [Science Pilot for Skylab 2, Joesph Kerwin] “We saw light flashes. I think all of us saw them. I saw them most often when I was in the sack at night with my eyes closed but awake naturally. They tended to wax and wane in frequency.”\n•\tSkylab 3 crew observations: \no\tPage 7-4. [Science Pilot for Skylab 3, Owen Garriott] “We saw that satellite about a week before splashdown. That was one of the most unusual things that we saw and I guess Jack [Lousma] noticed it looking out the window. This bright reddish object was out there and we tracked it for about 5 or 10 minutes. It was obviously a satellite in a very similar orbit to our own.”\no\tPage 20-1. [Science Pilot for Skylab 3, Owen Garriott] “Jack [Lousma] first noticed this rather large red star out the wardroom window. Upon close examination, it was much brighter than Jupiter or any of the other planets. It had a reddish hue to it, even though it was well above the horizon.”\n•\tSkylab 4 crew observation \no\tPage 7-8. [Commander for Skylab 4, Gerald P. Carr] “One other area of unusual events that we reported on the dump tapes was that on occasion we saw some lights flashing outside with very a definite motion relative to ours. We presumed that they were other pieces of Skylab, or possibly other satellites.”","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-d7-skylab-technical-crew-debriefing-1973.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-d7-skylab-technical-crew-debriefing-1973.jpg","bytes":659470,"sha256":"49e232c72a77f16f7e06593789a36882d614888d882a74d71eabcc7d2ce94fb6","extracted_text_path":"extracted/nasa-009-nasa-uap-d7-skylab-techincal-crew-debriefing-1973.md","year":1973,"ents":{"military_units":[],"classification":[],"us_states":["Texas"],"aircraft":[],"operations":[],"case_numbers":[],"names":["Skylab Techincal Crew","Technical Debriefing","Technical Crew Debriefing","Science Pilot","Joesph Kerwin","Owen Garriott","Gerald P. Carr","Policy Directive","National Aeronautics","Space Administration","Unexpected Visual Phenomenon","Medical Kits","Powered Flight","Heat Exchangers"],"mgrs":[]}},{"id":"nasa-010-nasa-uap-vm1-apollo-12-1969","type":"image","title":"NASA-UAP-VM001, Apollo 12, 1969","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1969","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Moon","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This archival photograph depicts the lunar surface as viewed from the landing site of Apollo 12. This image features a highlighted area of interest slightly to the right of the vertical axis of the frame, above the horizon, in which unidentified phenomena are visible. \n\nThis image has been modified from its original state to assist viewers in identifying specific areas of interest. These highlights are provided for contextual purposes only. Such alterations do not constitute an analytical judgment, investigative conclusion, or factual determination regarding the nature or significance of the subject matter.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-vm1-apollo-12-1969.jpg","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-vm1-apollo-12-1969.jpg","bytes":2526206,"sha256":"7f1c6a3220d6c59013fbc04f0011867ee5caf77f439fb es a highlighted area of interest slightly to the left of the vertical axis of the frame, above the horizon, in which unidentified phenomena are visible. \nThis image has been modified from its original state to assist viewers in identifying specific areas of interest. These highlights are provided for contextual purposes only. Such alterations do not constitute an analytical judgment, investigative conclusion, or factual determination regarding the nature or significance of the subject matter.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-vm4-apollo-12-1969.jpg","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-vm4-apollo-12-1969.jpg","bytes":2444608,"sha256":"92ae47295e427519e9189d241db01823223b6c232125ea8015a603100f80b6c2","extracted_text_path":"extracted/nasa-013-nasa-uap-vm4-apollo-12-1969.md","year":1969,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":[],"mgrs":[]}},{"id":"nasa-014-nasa-uap-vm5-apollo-12-1969","type":"image","title":"NASA-UAP-VM005, Apollo 12, 1969","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1969","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Moon","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This archival photograph depicts the lunar surface as viewed from the landing site of Apollo 12. This image features five highlighted areas of interest, labeled “Area 1” through “Area 5,” above the horizon, in which unidentified phenomena are visible.\nThis image has been modified from its original state to assist viewers in identifying specific areas of interest. These highlights are provided for contextual purposes only. Such alterations do not constitute an analytical judgment, investigative conclusion, or factual determination regarding the nature or significance of the subject matter.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-vm5-apollo-12-1969.jpg","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-vm5-apollo-12-1969.jpg","bytes":2590279,"sha256":"472793feaf12754d25ed699a667fdd5cee91d61dda66b8027ff7fbdc48d00ccd","extracted_text_path":"extracted/nasa-014-nasa-uap-vm5-apollo-12-1969.md","year":1969,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":[],"mgrs":[]}},{"id":"nasa-015-nasa-uap-vm6-apollo-17-1972","type":"image","title":"NASA-UAP-VM006, Apollo 17, 1972","agency":"NASA","agency_raw":"NASA","release_date":"5/8/26","incident_date":"1972","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Moon","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"As part of the review of historical UAP materials under PURSUE, DOW has opened a case to investigate the accompanying NASA photograph from the Apollo 17 mission, taken December 1972. The image contains three “dots” in a triangular formation in the lower right quadrant of the lunar sky that is clearly visible upon magnification of the image. While this photo has been previously released and discussed by keen observers, there is no consensus about the nature of the anomaly. New preliminary US government analysis suggests the image feature is potentially the result of a physical object in the scene. Additionally, as part of this investigation, the government has obtained the original film from the Apollo 17 mission and the results of the full NASA and DOW analysis will be released when completed.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/nasa-uap-vm6-apollo-17-1972.jpg","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/nasa-uap-vm6-apollo-17-1972.jpg","bytes":1778754,"sha256":"ce62e46b3535a4683ef6fd192d858be52dbbd9ca011ae1a9cb43dba947815f54","extracted_text_path":"extracted/nasa-015-nasa-uap-vm6-apollo-17-1972.md","year":1972,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":[],"mgrs":[]}},{"id":"state-001-59-214434-sp-16-7-18-1963","type":"pdf","title":"59_214434_SP 16 [7.18.1963]","agency":"State","agency_raw":"Department of State","release_date":"5/8/26","incident_date":"7/18/63","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"N/A","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This memorandum, dated July 18, 1963, from the Executive Office of the President, National Aeronautics and Space Council, relates to thoughts on the space alien race question. Included are details relating to plans if alien intelligence is discovered, expanding scientific knowledge, the possibility of life on Mars, and diplomatic policy.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/59_214434_sp_16_[7.18.1963].pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/59_214434_sp_16_[7.18.1963].jpg","bytes":1598931,"sha256":"aba3ec3b8ef0240364308cf046ccbfcd252c5a5d7ef470d696b72c1f41b2502d","extracted_text_path":"extracted/state-001-59-214434-sp-16-7-18-1963.md","year":1963,"ents":{"military_units":["CIA"],"classification":[],"us_states":["IL (Illinois)","Washington"],"aircraft":[],"operations":[],"case_numbers":[],"names":["National Aeronautics","Space Council","International Scientific Affairs","State\nWashington","Space Alien Race","Nineteenth Century","Atomic\nEnergy Commission","Asteroid Belt","Maxwell W. Hunter","Professional Staff"],"mgrs":[]}},{"id":"state-002-59-64634-711-5612-7-2852","type":"pdf","title":"59_64634_711.5612[7-2852","agency":"State","agency_raw":"Department of State","release_date":"5/8/26","incident_date":"7/18/52","incident_date_inferred":"1952-07-18","incident_date_inferred_source":"csv+summary","incident_date_inferred_csv_disagrees":false,"incident_location":"N/A","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This two page memorandum, dated July 18, 1952, relates to increased reports of unidentified flying objects (UFOs). Included in the record are possible explanations of increased sightings, such as technological improvements, historical records of UFOs, and U.S. Air Force opinions on UFOs.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/59_214434_sp_16_7.18.1963.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/59_214434_sp_16_7.18.1963.jpg","bytes":1598931,"sha256":"aba3ec3b8ef0240364308cf046ccbfcd252c5a5d7ef470d696b72c1f41b2502d","extracted_text_path":"extracted/state-002-59-64634-711-5612-7-2852.md","year":1952,"ents":{"military_units":["CIA"],"classification":[],"us_states":["IL (Illinois)","Washington"],"aircraft":[],"operations":[],"case_numbers":[],"names":["International Scientific Affairs","State\nWashington","Space Alien Race","Nineteenth Century","Atomic\nEnergy Commission","Asteroid Belt","Maxwell W. Hunter","Professional Staff"],"mgrs":[]}},{"id":"state-003-state-department-uap-cable-1-papua-new-guinea-january-28-198","type":"pdf","title":"State Department UAP Cable 001, Papua New Guinea, January 28, 1985","agency":"State","agency_raw":"Department of State","release_date":"5/8/26","incident_date":"1/24/85","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Papua New Guinea","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This document is a U.S. Department of State diplomatic cable from the U.S. Embassy in Port Moresby, Papua New Guinea to USCINCPAC (United States Indo-Pacific Command) at Honolulu, HI on January 28, 1985. \nThe cable reports that the U.S. Embassy to Papua New Guinea received an inquiry from the host nation’s intelligence services regarding reports of high-altitude, high-speed aircraft in Papua New Guinean airspace on the evening of January 24, 1985. The cable refers to a representative of the local intelligence services as “NIO,” or National Intelligence Officer, throughout. The NIO relayed to U.S. diplomatic personnel that residents had been “frightened by overflights, which led to the provincial premier’s calling of a public meeting on the subject.” The NIO also stated there had been “various reports of unidentified aerial phenomena the night of January 24, including fast-moving objects with lights, contrails, and noise.” The NIO assessed these reports as credible based upon the testimony of an Air Niugini pilot who said that their radar had “picked up aircraft flying south to north at high altitude and high speed.”\nThe cable concludes by characterizing the information provided by the NIO as “very sketchy.” It also sought clarification from U.S. INDOPACOM on the presence or absence of U.S. military aircraft within Papua New Guinean airspace on the night in question.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/dos-uap-d1-cable-1-papua-new-guinea-january-1985.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/dos-uap-d1-cable-1-papua-new-guinea-january-1985.jpg","bytes":301285,"sha256":"74032ed145b1badbb1049005b4b77ba95351cb573c3cf6578a77ca25f4033220","extracted_text_path":"extracted/state-003-state-department-uap-cable-1-papua-new-guinea-january-28-198.md","year":1985,"ents":{"military_units":["INDOPACOM","DIA","NRO","NSA","CIA","RAF"],"classification":["UNCLASSIFIED"],"us_states":["HI (Hawaii)"],"aircraft":["B-52"],"operations":[],"case_numbers":[],"names":["Papua New Guinea","Port Moresby","Papua New Guinean","National Intelligence Officer","Dissemination Rule","Archive Copy"],"mgrs":[]}},{"id":"state-004-state-department-uap-cable-2-kazakhstan-january-31-1994","type":"pdf","title":"State Department UAP Cable 002, Kazakhstan, January 31, 1994","agency":"State","agency_raw":"Department of State","release_date":"5/8/26","incident_date":"1/27/94","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Kazakhstan","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This document is a U.S. Department of State diplomatic cable from the U.S. Embassy in Dushanbe, Tajikistan to the Secretary of State in Washington, D.C. on January 31, 1994.\nOn January 27, 1994 one Tajik pilot and three American citizens encountered an UAP flying a 747 jet at 41,000 feet over Kazakhstan.  Object was a bright light of enormous intensity and approached over the horizon to the east at great speed and a much higher altitude.  Several pictures were taken of the craft making 90 degree turns, doing corkscrews and maneuvering in circles a great rates of speed.  Object was reported as resembling a bullet in flight.  Visual estimation of the contrails were at 100,000 feet, which was too high to leave contrails by ordinary aircraft.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/dos-uap-d2-cable-2-kazakhstan-january-1994.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/dos-uap-d2-cable-2-kazakhstan-january-1994.jpg","bytes":370719,"sha256":"64847feac6a309a847a39689ed2036e556f35a253189c7b9b33bd9d40b26b239","extracted_text_path":"extracted/state-004-state-department-uap-cable-2-kazakhstan-january-31-1994.md","year":1994,"ents":{"military_units":["DIA","NSA","CIA","RAF"],"classification":["UNCLASSIFIED"],"us_states":["IN (Indiana)","Washington"],"aircraft":[],"operations":[],"case_numbers":[],"names":["John Powers","Dissemination Rule","Archive Copy"],"mgrs":[]}},{"id":"state-005-state-department-uap-cable-3-tbilisi-georgia-october-30-2001","type":"pdf","title":"State Department UAP Cable 003, Tbilisi, Georgia, October 30, 2001","agency":"State","agency_raw":"Department of State","release_date":"5/8/26","incident_date":"10/28/2001-10/29/2001","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Georgia","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"On October 28-29, there was an incident alleged by the Georgian Foreign Ministry that Russian aircraft had violated Georgian airspace and bombed areas of the Kodori Gorge.  Russians denied any of the claims and said that it could have been UFOs.  Cable authors note that Russians typically engage in the “bold lie” when they wish to conceal actions.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/059uap00011.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/059uap00011.jpg","bytes":830359,"sha256":"df5874d4b68d17f996da1af0026bf701c627a6e21c244cabf6fd53689369beca","extracted_text_path":"extracted/state-005-state-department-uap-cable-3-tbilisi-georgia-october-30-2001.md","year":2001,"ents":{"military_units":["USN","DIA","NSA","CIA","FBI"],"classification":["UNCLASSIFIED"],"us_states":["Georgia"],"aircraft":["P-00"],"operations":[],"case_numbers":[],"names":["Georgian Foreign Ministry","Kodori Gorge","John Powers","Dissemination Rule","Archive Copy"],"mgrs":[]}},{"id":"state-006-state-department-uap-cable-4-ashgabat-turkmenistan-november","type":"pdf","title":"State Department UAP Cable 004, Ashgabat, Turkmenistan, November 5, 2004","agency":"State","agency_raw":"Department of State","release_date":"5/8/26","i , 20023 the Mexican Congress heard testimony on UAP from experts related to the debate about an Aerial Space Protection Law, which, if approved, would make Mexico the first country to formally acknowledge the presence of alien life on earth. Experts asked legislators to recognize UAP, guarantee airspace security, and allow UAP to be studied.  They presented to alleged alien corpses and videos of Mexican pilot’s encounters with fast-moving flying objects during flight. Disagreement about the efficacy and validity of the purported alien corpses.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/release_1/059uap00013.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/059uap00013.jpg","bytes":1221743,"sha256":"022b27728e86e291e078cac1d4fd5dcf225b2f6700175db9ea8ada19147318d8","extracted_text_path":"extracted/state-007-state-department-uap-cable-5-mexico-september-16-2003.md","year":2003,"ents":{"military_units":["NORTHCOM","SOUTHCOM","USN","DIA","CIA"],"classification":["UNCLASSIFIED"],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Mexican Congress","Aerial Space Protection","Weekly Political Blotter","Political Blotter","Ebrard Challenges","Leave Party","Names Commission Members","Mexico City Security","Secretary Steps Down","Might Run","City Head","Pablo Vazquez Becomes","Mexico City","New Security Secretary","Senate Leader Ricardo","Monreal Will Not","Mexico City Head","Criminals Targeting","Killing Prosecutors","Guadalajara Mayor Launches","Gubernatorial Campaign","Mexican Congress Hears","Alien Life","Former Foreign Secretary","Marcelo Ebrard"],"mgrs":[]}},{"id":"dow-083-dow-uap-pr050-4-uap-formation-iran-26-aug-2022-over-water-ca","type":"video","title":"DOW-UAP-PR050, \"4 UAP Formation Iran 26 Aug 2022 over water [CALLSIGN]\"","agency":"DoW","agency_raw":"Department of War","release_date":"5/22/26","incident_date":"2022","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"CENTCOM","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"On March 6, 2026, eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records allegedly held by the Department of War and the Intelligence Community. The All-domain Anomaly Resolution Office (AARO) identified a collection of responsive materials held on a classified network. Many of these materials lack a substantiated chain-of-custody.\n\nAARO assesses that this video, whose uploader-defined title is, “4 UAP Formation Iran 26 Aug 2022 over water [CALLSIGN],” is likely derived from an infrared sensor aboard a U.S. military platform operating within the United States Central Command area of responsibility in 2022. A user uploaded this video to a classified network in June 2024.\n\nVideo Duration: 00:00:20\nVideo Description:\n00:01-00:04: Four areas of contrast transit the sensor field-of-view, entering from the lower third of the left side of the screen and exiting near the center of the bottom of the frame.\n00:05-00:06: An area of contrast enters the sensor field-of-view from the top left corner of the screen.\n\nThis video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"https://d34w7g4gy10iej.cloudfront.net/video/2605/DOD_111719709/DOD_111719709-1920x1080-9000k.mp4","modal_image_url":"","bytes":10346860,"sha256":"8375a4c727c8e1fe69070ea87567a104dfa21cf2a690510c6e4d291bfd383f47","extracted_text_path":null,"year":2022,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":[],"mgrs":[]}},{"id":"dow-084-dow-uap-pr051-syrian-uap-instant-acceleration","type":"video","title":"DOW-UAP-PR051, \"Syrian UAP instant acceleration\"","agency":"DoW","agency_raw":"Department of War","release_date":"5/22/26","incident_date":"2021","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"CENTCOM","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"On March 6, 2026, eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records allegedly held by the Department of War and the Intelligence Community. The All-domain Anomaly Resolution Office (AARO) identified a collection of responsive materials held on a classified network. Many of these materials lack a substantiated chain-of-custody.\n\nAARO assesses that this video, whose uploader-defined title is, “Syrian UAP instant acceleration,” is likely derived from an infrared sensor aboard a U.S. military platform operating within the United States Central Command area of responsibility in 2021. A user uploaded this video to a classified network in June 2024.\n\nVideo Duration: 00:05:02\nVideo Description: This media was digitally altered prior to its upload to a classified network, and is presented as received.\n00:01-00:19: The sensor pans to maintain the position of an area of contrast within the center of the frame.\n00:20-00:21: The sensor stops tracking the area of contrast, causing it to rapidly exit the right side of the frame.\n00:22-00:27: No content.\n00:27-00:29 A black screen appears featuring the phrase “white edge threshold enhancement in attempt to highlight UAP shape. Original clip excerpt at 100% speed.” \n00:30-00:50: The video replays with digital alterations applied.\n00:51-00:53: A black screen appears featuring the phrase “50% speed.”\n00:54-01:05: The video replays with digital alterations applied.\n01:06-01:08: A black screen appears featuring the phrase “25% speed.”\n01:09-01:35: The video replays with digital alterations applied.\n01:36-01:41: A black screen appears featuring the phrase “B/W values inverted, picture zoomed”\n01:42-02:03: The video replays with digital alterations applied.\n02:04-02:09: A black screen appears featuring the phrase “full original clip TRT: 2:52”\n02:10-03:49: The video replays, showing additional footage of the area of contrast at its original resolution on a far zoom.\n03:50-04:02: The sensor rapidly zooms in and out.\n04:03-04:28: The sensor focuses and zooms in, locking a reticle around the area of contrast.\n04:29-5:01: The video replays 00:20-00:21, the period in which the sensor stops tracking the area of contrast, causing it to rapidly exit the right side of the frame.\n\nThis video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"https://d34w7g4gy10iej.cloudfront.net/video/2605/DOD_111719715/DOD_111719715-1920x1080-9000k.mp4","modal_image_url":"","bytes":235062797,"sha256":"d5c8ea707c836aa23c14750fed97711e8ecbebe230dabb5b8aeab327ca95a49b","extracted_text_path":null,"year":2021,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":[],"mgrs":[]}},{"id":"dow-085-dow-uap-d017-uap-reported-at-sandia-base-1948-1950","type":"pdf","title":"DOW-UAP-D017, UAP Reported at Sandia Base, 1948-1950","agency":"DoW","agency_raw":"Department of War","release_date":"5/22/26","incident_date":"1948-1950","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"New Mexico","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This file contains 116 pages of documentation from the Armed Forces Special Weapons Program (AFSWP) – the direct, post-World War II successor to the Manhattan Project – and from the U.S. Air Force – relating to a series of sightings and investigations in Sandia, New Mexico, from 1948-1950. This file contains 209 sightings of “green orbs,” “discs,” and “fireballs” reported near the military base. Witnesses reported unidentified anomalous phenomena (UAP) maneuvering, flying out of sight, disappearing, or exploding. The documents also include the results of contemporary investigations into residual copper powder found in some areas where sightings were reported. A few of these investigations became the basis for Project Grudge, which collected reports of unidentified flying objects from various other military installations – also included in this collection.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/052226/release_02/documents/DOW-UAP-D017_General_Correspondence_Of_Sandia.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/052226/release_02/thumbnails/DOW-UAP-D017_General_Correspondence_Of_Sandia.jpg","bytes":68764801,"sha256":"ec72132902a2f50d2ab032031386710fef1d1ae1face0226a90243f61d9347b4","extracted_text_path":"extracted/dow-085-dow-uap-d017-uap-reported-at-sandia-base-1948-1950.md","year":1948,"ents":{"military_units":["USAF","DIA","CIA","FBI"],"classification":["SECRET"],"us_states":["California","Colorado","Kentucky","Nebraska","New Mexico","Texas","Washington"],"aircraft":["E-4","P-1","B-3"],"operations":[],"case_numbers":[],"names":["Sandia Base","Armed Forces Special","Weapons Program","Manhattan Project","New Mexico","Project Grudge","Camp Campbell","Subjects Security Inspection","Guard Orders","Camp Campbell Military","Short Ti","Security Inspection","Lt Col","On Tuosdey","Uew Uexi","Comr Counts","Kirtland Field","An Interval","Colonel Doyle Rees","Proving Grounds","Uajor Charles","Aseaying Building","San Antonio","Ben Seely","Santa Rosa"],"mgrs":[]}},{"id":"cia-001-cia-uap-d001-intelligence-information-report-ussr-1973","type":"pdf","title":"CIA-UAP-D001, Intelligence Information Report, USSR, 1973","agency":"CIA","agency_raw":"Central Intelligence Agency","release_date":"5/22/26","incident_date":"12/20/73","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"USSR","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This document is a Central Intelligence Agency (CIA) intelligence information report (IIR) that describes human intelligence gathering activities in the Union of Soviet Socialist Republics (USSR). This report characterizes its content as informational, not as finally evaluated intelligence. In section 14 of this document, the source describes an incident occurring in summer of 1973, where he allegedly observed an airborne, luminous, bright green, unidentified object. The source described concentric circles forming around the phenomenon over a period of several minutes, before it dissipated. The source also stated that no sound attended the observation. The source offered no opinion on the nature of the phenomenon and was unable to provide further details regarding the incident.","redaction":"TRUE","source_url":"https://www.war.gov/medialink/ufo/052226/release_02/documents/CIA-UAP-D001_Intelligence_Information_Report_USSR_1973.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/052226/release_02/thumbnails/CIA-UAP-D001_Intelligence_Information_Report_USSR_1973.jpg","bytes":154038,"sha256":"d3039ed486d8400be3263c0c438b199abfdb8ac030156baff1536f007349d315","extracted_text_path":"extracted/cia-001-cia-uap-d001-intelligence-information-report-ussr-1973.md","year":1973,"ents":{"military_units":["CIA"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Central Intelligence Agency","Soviet Socialist Republics","President Trump","The Sary Shagan","Weapons Testing","Field Comment","The System"],"mgrs":[]}},{"id":"odni-001-odni-uap-d001-usper-narrative-senior-usic-official","type":"pdf","title":"ODNI-UAP-D001, USPER Narrative, Senior USIC Official","agency":"ODNI","agency_raw":"Office of the Director of National Intelligence","release_date":"5/22/26","incident_date":"2025","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Western United States","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This document is a first-hand account written by a currently serving (May 2026) senior U.S. intelligence official. The official was part of a team investigating reports of unusual noises and sightings of unidentified anomalous phenomena in and near a sensitive U.S. military facility in late 2025. From the official’s vantage point as a helicopter passenger, the official recounts encountering unidentified “glowing orbs” both at close range and at a distance. The account describes an apparent high-speed object moving low to the ground, which appeared to split in two and accelerate away in two different directions. It also describes numerous higher-altitude “orbs,” some of which the official assessed to be in close proximity to the helicopter. This account is accompanied by infrared imagery taken during the same exercise by other federal officials from the ground, originally released on war.gov/UFO on May 8, 2026.","redaction":"","source_url":"https://www.war.gov/medialink/ufo/052226/release_02/documents/ODNI-UAP-D001_USPER_Narrative_Senior_USIC.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/052226/release_02/thumbnails/ODNI-UAP-D001_USPER_Narrative_Senior_USIC.jpg","bytes":34195,"sha256":"87297ea7ad56473613924b4a11c1c88b42d99515b814c4a4f95d84d60013787e","extracted_text_path":"extracted/odni-001-odni-uap-d001-usper-narrative-senior-usic-official.md","year":2025,"ents":{"military_units":["ODNI"],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":["Joint Operations Center","Unidentified Aerial Phenomena","Forward Looking Infrared","Night Vision Goggles"],"mgrs":[]}},{"id":"nasa-016-nasa-uap-d008-apollo-12-medical-debriefing-tape-12-1969","type":"audio","title":"NASA-UAP-D008, Apollo 12 Medical Debriefing - Tape 12, 1969","agency":"NASA","agency_raw":"NASA","release_date":"5/22/26","incident_date":"1969","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"Texas","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"During a medical debriefing of the crew of the Apollo 12 mission, Commander Charles “Pete” Conrad, Command Module Pilot Richard “Dick” F. Gordon, and Lunar Module Pilot Alan L. Bean describe their observations of instances of light flashes or “streaks of lights.” The astronauts each reported that these experiences occurred in the dark as they tried to sleep.\nThe NASA medical team considered whether similar phenomena reported by Apollo 11 Lunar Module Pilot Buzz Aldrin had been attributable to exposure of the retina by cosmic rays. NASA later determined that the phenomena reported by the Apollo 12 flight crew were internal to the astronauts’ vision rather than external light sources.","redaction":"","source_url":"https://d34w7g4gy10iej.cloudfront.net/video/2605/DOD_111721693/DOD_111721693-256x144-1000k.mp4","modal_image_url":"","bytes":15127966,"sha256":"80506ca3e05c6370ba6c6f3742da707d422263656b8a9c00a29de408e8f5e82e","extracted_text_path":null,"year":1969,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":[],"mgrs":[]}},{"id":"doe-001-doe-uap-d001-enhanced-pantex-imagery","type":"pdf" tion":"Iraq","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"This document is a Mission Report (MISREP), a standardized reporting form the U.S. Military uses to record the circumstances surrounding its operations. U.S. military services often use MISREPs to report Unidentified Anomalous Phenomena (UAP) to AARO. The GENTEXT, or “general text” section of these reports often contains important qualitative, contextual information, distinguishing it from the more quantitative, or numerical, data found elsewhere in the report.\nA U.S. military operator reported observing “several bright objects maneuvering quickly” west to east northeast. The operator reported achieving a track on the UAP via an onboard targeting pod for approximately 20 seconds. The report describes that UAP then dimmed and disappeared from the targeting pod.\nAll descriptive and estimative language contained in this report reflects the reporter’s subjective interpretation at the time of the event. Such characterizations should not be interpreted as a conclusive indication of the presence or absence of any intrinsic object features or performance characteristics.","redaction":"TRUE","source_url":"https://www.war.gov/medialink/ufo/release_1/dow-uap-d20-mission-report-iraq-2023.pdf","modal_image_url":"https://www.war.gov/medialink/ufo/release_1/thumbnail/dow-uap-d20-mission-report-iraq-2023.jpg","bytes":3698245,"sha256":"71ca8826db94d61583083ef8465a6902564532dcab7d49d0d2db3e86aaf85b2f","extracted_text_path":"extracted/dow-086-dow-uap-d020-mission-report-iraq-2023.md","year":2023,"ents":{"military_units":["USCENTCOM","CENTCOM","AARO"],"classification":[],"us_states":[],"aircraft":[],"operations":["INHERENT RESOLVE"],"case_numbers":[],"names":["Unidentified Anomalous Phenomena","President Trump","Richard A. Harrison","Associated Caveats","Operations Center","Tasking Order","Country Tasked","Service Tasked","Phone Numlt","Phone Numbescl","Phone Numller","Full Name","Phone Number","Aircraft Callsign","Radar Name","Radar Software Load","Radar Warning Receiver","Software Load","Chaff Designator","Num Chaff","Flare Designator","Num Flares","Towed Decoy Name","Towed Decoy Software","Num Towed Decoys"],"mgrs":[]}},{"id":"dow-087-dow-uap-pr052-uap-uso-formation-callsign-mission","type":"video","title":"DOW-UAP-PR052, \"UAP USO Formation [CALLSIGN] (Mission)\"","agency":"DoW","agency_raw":"Department of War","release_date":"5/22/26","incident_date":"","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"N/A","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"On March 6, 2026, eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records allegedly held by the Department of War and the Intelligence Community. The All-domain Anomaly Resolution Office (AARO) identified a collection of responsive materials held on a classified network. Many of these materials lack a substantiated chain-of-custody.\n\nAARO assesses that this video, whose uploader-defined title is, “UAP USO Formation [CALLSIGN] (Mission),” is likely derived from an infrared sensor aboard a U.S. military platform. A user uploaded this video to a classified network in June 2024.\n\nVideo Duration: 00:08:16\nVideo Description: This media was digitally altered prior to its upload to a classified network, and is presented as received.\n\n00:00-00:05: Four areas of contrast transit the frame from the bottom third of the left side to the bottom third of the right side of the frame.\n00:06-00:38: The video appears to cut, refocusing on four areas of contrast. Visual elements of the sensor display enter and exit the frame.\n00:39-06:08: The video seems to cut multiple times, applying various contrast filters and zoom levels. Visual elements of the sensor display enter and exit the frame.\n06:09-06:50: The sensor zooms in on four areas of contrast.\n06:51-08:10: The areas of contrast become increasingly indistinct over time as the video quality degrades.\n08:11-08:15: Video appears to cut, or zoom out, likely cutting to an earlier portion of the video, with the areas of contrast more visible.\n\nThis video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.","redaction":"TRUE","source_url":"https://d34w7g4gy10iej.cloudfront.net/video/2605/DOD_111719718/DOD_111719718.mp4","modal_image_url":"","bytes":513739591,"sha256":"e67b3a3b3d863ef88cc8c4e6b73e9c9bff896506a2962956ed70f508fd8815f5","extracted_text_path":null,"year":null,"ents":{"military_units":[],"classification":[],"us_states":[],"aircraft":[],"operations":[],"case_numbers":[],"names":[],"mgrs":[]}},{"id":"dow-088-dow-uap-pr053-cigar-shaped-or-fast-sherical-uap-clip-15-oct","type":"video","title":"DOW-UAP-PR053, \"Cigar Shaped or Fast Sherical UAP clip 15 OCT 22\"","agency":"DoW","agency_raw":"Department of War","release_date":"5/22/26","incident_date":"2022","incident_date_inferred":"","incident_date_inferred_source":"","incident_date_inferred_csv_disagrees":false,"incident_location":"CENTCOM","incident_location_inferred":"","incident_location_inferred_source":"","incident_location_inferred_csv_disagrees":false,"summary":"On March 6, 2026, eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records allegedly held by the Department of War and the Intelligence Community. The All-domain Anomaly Resolution Office (AARO) identified a collection of responsive materials held on a classified network. Many of these materials lack a substantiated chain-of-custody.\n\nAARO assesses that this video, whose up
